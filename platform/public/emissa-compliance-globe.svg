<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
  <title id="title">Emissa global supplier compliance network</title>
  <desc id="desc">Gold and emerald digital globe with supplier, evidence, product and compliance nodes orbiting the Emissa mark.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#0b211c" stop-opacity=".92"/>
      <stop offset=".58" stop-color="#081713" stop-opacity=".82"/>
      <stop offset="1" stop-color="#030807" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#16392e"/>
      <stop offset=".48" stop-color="#0a241d"/>
      <stop offset=".82" stop-color="#06120f"/>
      <stop offset="1" stop-color="#020706"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b6"/>
      <stop offset=".46" stop-color="#d5a84a"/>
      <stop offset="1" stop-color="#8d650e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57b27d"/>
      <stop offset=".54" stop-color="#1e7b52"/>
      <stop offset="1" stop-color="#0b4b32"/>
    </linearGradient>
    <filter id="glowGold" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="globeClip"><circle cx="280" cy="280" r="176"/></clipPath>
  </defs>

  <circle cx="280" cy="280" r="260" fill="url(#bg)"/>
  <circle cx="280" cy="280" r="222" fill="none" stroke="#d5a84a" stroke-opacity=".12"/>
  <circle cx="280" cy="280" r="206" fill="none" stroke="#2f8a5e" stroke-opacity=".11"/>
  <circle cx="280" cy="280" r="187" fill="#d5a84a" fill-opacity=".055" filter="url(#soft)"/>

  <!-- outer orbital field -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="280" cy="280" rx="244" ry="96" transform="rotate(-17 280 280)" stroke="#d5a84a" stroke-opacity=".28"/>
    <ellipse cx="280" cy="280" rx="239" ry="118" transform="rotate(22 280 280)" stroke="#2f8a5e" stroke-opacity=".28"/>
    <ellipse cx="280" cy="280" rx="226" ry="72" transform="rotate(67 280 280)" stroke="#d5a84a" stroke-opacity=".18"/>
    <ellipse cx="280" cy="280" rx="220" ry="82" transform="rotate(111 280 280)" stroke="#2f8a5e" stroke-opacity=".16"/>
  </g>

  <!-- globe -->
  <circle cx="280" cy="280" r="176" fill="url(#sphere)" stroke="url(#gold)" stroke-width="2.4"/>
  <circle cx="280" cy="280" r="166" fill="none" stroke="#d5a84a" stroke-opacity=".16"/>
  <g clip-path="url(#globeClip)" fill="none" stroke-linecap="round">
    <ellipse cx="280" cy="280" rx="168" ry="52" stroke="#d5a84a" stroke-opacity=".18"/>
    <ellipse cx="280" cy="280" rx="168" ry="94" stroke="#2f8a5e" stroke-opacity=".16"/>
    <ellipse cx="280" cy="280" rx="168" ry="132" stroke="#d5a84a" stroke-opacity=".12"/>
    <ellipse cx="280" cy="280" rx="56" ry="172" stroke="#d5a84a" stroke-opacity=".15"/>
    <ellipse cx="280" cy="280" rx="102" ry="172" stroke="#2f8a5e" stroke-opacity=".14"/>
    <ellipse cx="280" cy="280" rx="140" ry="172" stroke="#d5a84a" stroke-opacity=".1"/>
  </g>

  <!-- abstract continents -->
  <g clip-path="url(#globeClip)" fill="#d2b55a" fill-opacity=".34" stroke="#f0cf74" stroke-opacity=".24" stroke-width="1">
    <path d="M151 208l18-28 31-17 23 7 12 19 21 10 8 19-17 12-5 25-28 8-17 26-15-4-12-24-21-10-8-24z"/>
    <path d="M229 292l24 8 11 19-8 27-19 29-8 36-13 12-10-21 7-23-8-24 9-26z"/>
    <path d="M313 183l20-12 31 4 21 13 27 5 18 21-11 16-22-2-19 15-25-5-18 11-20-9-13-25z"/>
    <path d="M323 253l21-10 26 8 11 26-4 35-16 22-9 32-23 18-17-15 6-24-14-24 8-23-8-17z"/>
    <path d="M399 350l18 6 9 15-8 13-22-5-10-15z"/>
  </g>

  <!-- network mesh -->
  <g stroke="#d5a84a" stroke-opacity=".38" stroke-width="1" fill="none">
    <path d="M172 224L224 202 277 228 331 196 388 224 417 270 371 301 313 284 269 321 215 296 172 224"/>
    <path d="M189 334L231 277 289 251 352 262 396 320"/>
    <path d="M209 190L264 179 316 215 363 186"/>
  </g>
  <g fill="#f0c66c" filter="url(#glowGold)">
    <circle cx="172" cy="224" r="3.2"/><circle cx="224" cy="202" r="2.4"/><circle cx="277" cy="228" r="3.4"/><circle cx="331" cy="196" r="2.7"/><circle cx="388" cy="224" r="3.3"/><circle cx="417" cy="270" r="2.7"/><circle cx="371" cy="301" r="3.2"/><circle cx="313" cy="284" r="2.4"/><circle cx="269" cy="321" r="3.2"/><circle cx="215" cy="296" r="2.4"/>
  </g>
  <g fill="#42a36e" filter="url(#glowGreen)">
    <circle cx="189" cy="334" r="3.3"/><circle cx="231" cy="277" r="2.8"/><circle cx="352" cy="262" r="3"/><circle cx="396" cy="320" r="3.1"/><circle cx="264" cy="179" r="2.8"/>
  </g>

  <!-- central identity -->
  <circle cx="280" cy="280" r="69" fill="#06120f" fill-opacity=".78" stroke="#d5a84a" stroke-opacity=".34"/>
  <circle cx="280" cy="280" r="48" fill="#071b16" fill-opacity=".85" stroke="#2f8a5e" stroke-opacity=".28"/>
  <path d="M280 215 L326 298 L307 289 L280 244 L253 289 L234 298 Z" fill="url(#gold)" filter="url(#glowGold)"/>
  <path d="M280 300 L306 348 L295 341 L280 317 L265 341 L254 348 Z" fill="url(#green)" filter="url(#glowGreen)"/>

  <!-- orbital nodes -->
  <g>
    <g transform="translate(280 73)"><circle r="27" fill="#081512" stroke="#d5a84a" stroke-opacity=".46"/><rect x="-10" y="-11" width="18" height="22" rx="2" fill="none" stroke="#d5a84a" stroke-width="1.5"/><path d="M-6-5h10M-6 0h10M-6 5h7M9 2l5 5 7-9" fill="none" stroke="#d5a84a" stroke-width="1.5" stroke-linecap="round"/></g>
    <g transform="translate(100 183)"><circle r="26" fill="#081512" stroke="#d5a84a" stroke-opacity=".46"/><path d="M-12 10V-6h8v6l8-5v15M-12-6l5-7 5 7M-7 5h3M2 4h5" fill="none" stroke="#d5a84a" stroke-width="1.6" stroke-linejoin="round"/></g>
    <g transform="translate(462 188)"><circle r="26" fill="#081512" stroke="#d5a84a" stroke-opacity=".46"/><path d="M-11-8L0-14 11-8 0-2zM-11-8v14L0 13V-2M11-8V6L0 13" fill="none" stroke="#d5a84a" stroke-width="1.5" stroke-linejoin="round"/></g>
    <g transform="translate(112 387)"><circle r="26" fill="#081512" stroke="#d5a84a" stroke-opacity=".46"/><circle cy="-6" r="7" fill="none" stroke="#d5a84a" stroke-width="1.5"/><path d="M-12 13c2-9 7-13 12-13s10 4 12 13" fill="none" stroke="#d5a84a" stroke-width="1.5"/></g>
    <g transform="translate(447 390)"><circle r="26" fill="#081512" stroke="#d5a84a" stroke-opacity=".46"/><circle r="10" fill="none" stroke="#d5a84a" stroke-width="1.5"/><path d="M-4 0l3 3 6-7M-7 12l-3 8 7-3 3 4 3-9" fill="none" stroke="#d5a84a" stroke-width="1.5" stroke-linejoin="round"/></g>
    <g transform="translate(280 488)"><circle r="27" fill="#081512" stroke="#d5a84a" stroke-opacity=".46"/><path d="M0 12c-12-2-18-11-16-21 10 0 17 4 20 11M0 12c13-4 18-14 16-25-10 1-17 5-20 13M0 12V-3" fill="none" stroke="#d5a84a" stroke-width="1.6" stroke-linecap="round"/></g>
  </g>

  <!-- orbital lights -->
  <g fill="#f0c66c" filter="url(#glowGold)"><circle cx="53" cy="263" r="2.7"/><circle cx="180" cy="91" r="2.4"/><circle cx="438" cy="102" r="2.8"/><circle cx="511" cy="292" r="2.5"/><circle cx="386" cy="480" r="2.6"/></g>
  <g fill="#42a36e" filter="url(#glowGreen)"><circle cx="84" cy="344" r="2.4"/><circle cx="255" cy="60" r="2.5"/><circle cx="479" cy="136" r="2.3"/><circle cx="488" cy="354" r="2.7"/><circle cx="175" cy="471" r="2.5"/></g>
</svg>